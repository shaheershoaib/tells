name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests
      - name: The docs carry no tells
        run: |
          for f in README.md skills/tells/SKILL.md; do
            python3 skills/tells/tells.py scan < "$f"
          done
